name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Go backend tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -count=1 -timeout 120s ./...

  # Job 2: Frontend build (also validates frontend compiles)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm run build

  # Job 3: Build Windows binary
  build-windows:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/proxy-cat-windows-amd64.exe ./cmd/proxy-cat
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-windows-amd64
          path: dist/proxy-cat-windows-amd64.exe

  # Job 4: Build macOS binaries (amd64 + arm64)
  build-darwin:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o dist/proxy-cat-darwin-amd64 ./cmd/proxy-cat
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o dist/proxy-cat-darwin-arm64 ./cmd/proxy-cat
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-darwin-amd64
          path: dist/proxy-cat-darwin-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-darwin-arm64
          path: dist/proxy-cat-darwin-arm64

  # Job 5: Build Linux binaries (amd64 + arm64)
  build-linux:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/proxy-cat-linux-amd64 ./cmd/proxy-cat
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dist/proxy-cat-linux-arm64 ./cmd/proxy-cat
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-linux-amd64
          path: dist/proxy-cat-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-linux-arm64
          path: dist/proxy-cat-linux-arm64

  # Job 6: Build Docker image
  build-docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t proxy-cat:latest .

  # Job 7: Build Android binary
  build-android:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o dist/proxy-cat-android-arm64 ./cmd/proxy-cat
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-cat-android-arm64
          path: dist/proxy-cat-android-arm64
